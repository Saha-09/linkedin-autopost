name: Generate LinkedIn drafts

on:
  schedule:
    - cron: "0 1 1-31/2 * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Breaking buzz to write about (leave blank for normal drafts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate and send drafts
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MARKET_BRIEF_URL: ${{ secrets.MARKET_BRIEF_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUZZ_TOPIC: ${{ github.event.inputs.topic }}
        run: python src/generate.py
      - name: Commit queued drafts
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost@users.noreply.github.com"
          git add queue/
          git diff --staged --quiet || git commit -m "queue drafts"
          git pull --rebase --autostash || true
          git push || true
